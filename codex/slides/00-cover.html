<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Codex · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #0D0D0D; color: #F5F5F5;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .s00-stage { position: relative; width: 1920px; height: 1080px; background: #0D0D0D; }

  .s00-bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(108,92,231,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108,92,231,0.06) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 1200px 700px at center, #000 10%, transparent 80%);
  }

  .s00-bg-glow {
    position: absolute; top: 50%; left: 50%;
    width: 900px; height: 900px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(108,92,231,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  .s00-top-strip {
    position: absolute; top: 60px; left: 120px; right: 120px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .s00-logo {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 28px; font-weight: 700; color: #6C5CE7;
    letter-spacing: -0.01em;
  }
  .s00-top-label {
    font-size: 13px; letter-spacing: 0.28em; color: #888;
    text-transform: uppercase;
  }

  .s00-center {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; width: 1600px;
  }

  .s00-kicker {
    font-size: 18px; letter-spacing: 0.32em; color: #6C5CE7;
    text-transform: uppercase; font-weight: 600;
    margin-bottom: 32px;
  }
  .s00-kicker::before,
  .s00-kicker::after {
    content: ""; display: inline-block; width: 60px; height: 1px;
    background: #6C5CE7; vertical-align: middle;
    margin: 0 24px;
  }

  .s00-title {
    font-family: "Source Serif 4", "Noto Serif SC", "Songti SC", Georgia, serif;
    font-size: 110px; line-height: 1.08; font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 40px;
    color: #F5F5F5;
  }
  .s00-title .accent { color: #6C5CE7; font-style: italic; }

  .s00-subtitle {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 30px; line-height: 1.5; color: #999;
    font-style: italic; font-weight: 400;
    margin-bottom: 60px;
  }

  .s00-meta {
    display: flex; justify-content: center; gap: 48px;
    font-size: 20px; letter-spacing: 0.24em; color: #666;
    text-transform: uppercase;
  }
  .s00-meta span { position: relative; }
  .s00-meta span:not(:last-child)::after {
    content: ""; position: absolute;
    right: -24px; top: 50%;
    width: 4px; height: 4px; border-radius: 50%;
    background: #444; transform: translateY(-50%);
  }

  .s00-bottom {
    position: absolute; bottom: 60px; left: 120px; right: 120px;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .s00-bottom-left {
    font-size: 18px; letter-spacing: 0.18em; color: #666;
    text-transform: uppercase;
  }
  .s00-bottom-right {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 18px; color: #888; font-style: italic;
  }
</style>
</head>
<body>
<div class="s00-stage">
  <div class="s00-bg-grid"></div>
  <div class="s00-bg-glow"></div>

  <div class="s00-top-strip">
    <div class="s00-logo">Codex</div>
    <div class="s00-top-label">AI 编程智能体 · 深度解读</div>
  </div>

  <div class="s00-center">
    <div class="s00-kicker">2026 · 异军突起</div>
    <h1 class="s00-title">Codex<br>从被碾压到<span class="accent">异军突起</span></h1>
    <div class="s00-subtitle">Codex 这两年的逆袭故事 · 深度解读</div>
    <div class="s00-meta">
      <span>400 万周活</span>
      <span>10 亿美元 ARR</span>
      <span>沙箱安全</span>
      <span>零门槛</span>
    </div>
  </div>

  <div class="s00-bottom">
    <div class="s00-bottom-left">00 · COVER &nbsp;&nbsp;/&nbsp;&nbsp; 2026.05.29</div>
    <div class="s00-bottom-right">Produced by 庆兵 · based on Codex public reports & community</div>
  </div>
</div>
</body>
</html>
