<head>
<meta charset="UTF-8">
<title>Codex · 从被碾压到异军突起 · 深度解读</title>

<script>
  window.DECK_MANIFEST = [
    { file: "slides/00-cover.html",           label: "封面" },
    { file: "slides/01-onepager.html",        label: "One-Pager · 核心数据速览" },
    { file: "slides/02-opening.html",         label: "震撼开场 · 100个AI实例" },
    { file: "slides/03-timeline.html",        label: "2025-2026 时间线" },
    { file: "slides/04-origin.html",          label: "先发优势的浪费" },
    { file: "slides/05-comeback.html",        label: "逆袭之路 · 4个因素" },
    { file: "slides/06-reorg.html",           label: "战略升级 · 组织架构调整" },
    { file: "slides/07-three-diffs.html",     label: "三大核心差异 · 总览" },
    { file: "slides/08-diff-barrier.html",    label: "差异① 上手门槛" },
    { file: "slides/09-diff-safety.html",     label: "差异② 安全可控" },
    { file: "slides/10-diff-remote.html",     label: "差异③ 远程控制" },
    { file: "slides/11-jcurve.html",          label: "J型曲线 vs 直线上手" },
    { file: "slides/12-conclusion.html",      label: "总结与展望" },
    { file: "slides/13-credits.html",         label: "鸣谢" },
  ];
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: #0D0D0D; color: #F5F5F5;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .deck-shell {
    position: relative; width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .stage {
    position: absolute;
    transform-origin: 0 0;
    box-shadow: 0 0 60px rgba(108,92,231,0.15);
  }
  .stage iframe {
    width: 1920px; height: 1080px;
    border: none; display: block;
    background: #0D0D0D;
  }

  .nav-zone {
    position: fixed; top: 0; bottom: 0; width: 80px;
    cursor: pointer; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s;
  }
  .nav-zone:hover { opacity: 1; }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-hint {
    font-size: 40px; color: rgba(255,255,255,0.4);
    font-family: "Source Serif 4", Georgia, serif;
    user-select: none;
  }

  .counter {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    font-size: 14px; color: #888;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,0.6);
    padding: 8px 20px;
    border-radius: 20px;
    z-index: 101;
  }
  .counter .label {
    margin-left: 12px; color: #6C5CE7;
    font-weight: 600;
  }

  .toc-toggle {
    position: fixed; top: 24px; right: 24px;
    font-size: 14px; color: #888;
    background: rgba(0,0,0,0.6);
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer; z-index: 102;
    letter-spacing: 0.1em;
    transition: color 0.2s;
  }
  .toc-toggle:hover { color: #6C5CE7; }

  .toc-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 320px;
    background: rgba(13,13,13,0.97);
    border-left: 1px solid rgba(255,255,255,0.08);
    overflow-y: auto; z-index: 200;
    padding: 80px 30px 30px;
    transform: translateX(100%);
    transition: transform 0.25s ease;
  }
  .toc-panel.open { transform: translateX(0); }
  .toc-item {
    padding: 12px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.06);
    font-size: 15px; color: #888;
    cursor: pointer; line-height: 1.4;
    transition: color 0.15s;
  }
  .toc-item:hover { color: #F5F5F5; }
  .toc-item.active { color: #6C5CE7; font-weight: 600; }

  @media print {
    .nav-zone, .counter, .toc-toggle, .toc-panel { display: none !important; }
    .stage { position: static !important; transform: none !important; box-shadow: none !important; }
    .stage iframe { width: 100% !important; height: auto !important; min-height: 100vh; }
  }
</style>
</head>
<body>
<div class="deck-shell">
  <div class="stage" id="stage">
    <iframe id="frame" src="about:blank"></iframe>
  </div>
</div>

<div class="nav-zone left"  id="navL"><div class="nav-hint">‹</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">›</div></div>
<div class="counter" id="counter">1 / 1</div>

<div class="toc-toggle" id="tocToggle">☰ Index</div>
<div class="toc-panel" id="tocPanel"></div>

<script>
(function () {
  const W = 1920;
  const H = 1080;
  const deck = window.DECK_MANIFEST || [];
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const tocPanel = document.getElementById('tocPanel');
  const tocToggle = document.getElementById('tocToggle');
  const storageKey = 'codex-deck-index-' + location.pathname;
  let current = 0;

  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const x = (window.innerWidth  - W * s) / 2;
    const y = (window.innerHeight - H * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    stage.style.top = '0';
    stage.style.left = '0';
  }

  frame.addEventListener('load', function () {
    try {
      frame.contentDocument.addEventListener('pointerup', function () {
        window.focus();
      });
    } catch (_) {}
  });

  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    current = idx;
    frame.src = deck[idx].file;
    counter.innerHTML = `${idx + 1} / ${deck.length} <span class="label">${deck[idx].label || ''}</span>`;
    try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
    if (location.hash !== '#' + (idx + 1)) {
      history.replaceState(null, '', '#' + (idx + 1));
    }
    document.querySelectorAll('.toc-item').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
      if (i === idx) el.scrollIntoView({ block: 'nearest' });
    });
  }

  function next() { show((current + 1) % deck.length); }
  function prev() { show((current - 1 + deck.length) % deck.length); }

  deck.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'toc-item';
    el.textContent = item.label || `Page ${i + 1}`;
    el.addEventListener('click', () => { show(i); tocPanel.classList.remove('open'); });
    tocPanel.appendChild(el);
  });
  tocToggle.addEventListener('click', () => tocPanel.classList.toggle('open'));
  document.addEventListener('click', (e) => {
    if (!tocPanel.contains(e.target) && !tocToggle.contains(e.target)) {
      tocPanel.classList.remove('open');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp':              e.preventDefault(); prev(); break;
      case 'Home':                                    e.preventDefault(); show(0); break;
      case 'End':                                     e.preventDefault(); show(deck.length - 1); break;
      case '0': case '1': case '2': case '3': case '4':
      case '5': case '6': case '7': case '8': case '9':
        e.preventDefault();
        show(e.key === '0' ? deck.length - 1 : parseInt(e.key, 10) - 1);
        break;
      case 'p': case 'P':                             window.print(); break;
      case 'i': case 'I':                             tocPanel.classList.toggle('open'); break;
    }
  });

  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#(\d+)$/);
    if (m) show(parseInt(m[1], 10) - 1);
  });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else try {
    const v = parseInt(localStorage.getItem(storageKey), 10);
    if (!isNaN(v) && v >= 0 && v < deck.length) current = v;
  } catch (_) {}
  fit();
  show(current);
})();
</script>

</body>
</html>
